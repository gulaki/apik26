# Every Monday: the CI jobs on the newest runner images and Emscripten,
# with ten times the random cases and new seeds (the run number), so
# toolchain updates and rare cases show up before a pull request meets them.
# A failure opens an issue labelled weekly-ci, or comments on the open one.
# The run also reports newer releases of the vendored web libraries.
name: Weekly

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      random-scale:
        description: How many times the usual number of random cases
        default: "10"
      random-seed:
        description: Seed for the random tests (empty for the run number)
        default: ""

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      latest: true
      random-scale: ${{ inputs.random-scale || '10' }}
      random-seed: ${{ inputs.random-seed || format('{0}', github.run_number) }}

  vendored:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report newer releases of the vendored web libraries
        run: |
          {
            echo "## Vendored web libraries"
            echo
            python3 .github/scripts/vendored_versions.py
          } >> "$GITHUB_STEP_SUMMARY"

  report:
    needs: [ci]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SEED: ${{ github.run_number }}
    steps:
      - name: Open or update the weekly-ci issue
        run: |
          body="The weekly run failed: $RUN_URL

          Run the random tests again with \`APIK_RANDOM_SCALE=10 APIK_RANDOM_SEED=$SEED python -m pytest\`."
          open="$(gh issue list --label weekly-ci --state open --json number --jq '.[0].number')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Weekly CI failed" --label weekly-ci --body "$body"
          fi
