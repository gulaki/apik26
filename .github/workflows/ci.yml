# The whole test suite on every pull request and every push to main, on
# Linux (gcc and clang), macOS, Windows (MinGW-w64 gcc) and WebAssembly
# (Emscripten and node). Each job names in SCRIBE_REQUIRE the tools it
# installs, so a test that needs one fails instead of skipping.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Python Scribe supports.
          - name: linux-gcc
            os: ubuntu-24.04
            python: "3.10"
            cc: gcc
            require: cc,ubsan,make,node
          # Every end-to-end program also built with UBSan.
          - name: linux-clang-ubsan
            os: ubuntu-24.04
            python: "3.x"
            cc: clang
            sanitize: "1"
            require: cc,ubsan,make,node
          - name: macos
            os: macos-15
            python: "3.x"
            cc: clang
            require: cc,ubsan,make,node
          # No UBSan runtime: UBSan runs in trap mode. No make.
          - name: windows-mingw
            os: windows-2025
            python: "3.x"
            cc: gcc
            require: cc,ubsan,node
    env:
      CC: ${{ matrix.cc }}
      SCRIBE_REQUIRE: ${{ matrix.require }}
      SCRIBE_SANITIZE: ${{ matrix.sanitize || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      - run: ${{ matrix.cc }} --version
      - run: python -m pytest -ra

  # The same examples built with emcc and run under node must print what
  # their native builds print.
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SCRIBE_REQUIRE: cc,make,node,emcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.13
          actions-cache-folder: emsdk-cache
      - run: python -m pip install -e ".[test]"
      - run: emcc --version
      - run: python -m pytest -ra tests/test_wasm.py
