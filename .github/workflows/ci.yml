# The whole test suite on every pull request and every push to main, on
# Linux (gcc and clang), macOS, Windows (MinGW-w64 gcc) and WebAssembly
# (Emscripten and node). Each job names in APIK_REQUIRE the tools it
# installs, so a test that needs one fails instead of skipping. A
# windows-msvc job tries Microsoft's cl too, without failing the run yet.
#
# The weekly workflow calls it with `latest: true` (the newest runner images
# and Emscripten) and with more, reseeded, random cases.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      latest:
        type: boolean
        default: false
      random-scale:
        type: string
        default: ""
      random-seed:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"
  # Empty except when called: the random tests keep their fixed cases.
  APIK_RANDOM_SCALE: ${{ inputs.random-scale }}
  APIK_RANDOM_SEED: ${{ inputs.random-seed }}

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ inputs.latest && matrix.latest || matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Python APIK26 supports.
          - name: linux-gcc
            os: ubuntu-24.04
            latest: ubuntu-latest
            python: "3.10"
            cc: gcc
            require: cc,ubsan,make,node
          # Every end-to-end program also built with UBSan.
          - name: linux-clang-ubsan
            os: ubuntu-24.04
            latest: ubuntu-latest
            python: "3.x"
            cc: clang
            sanitize: "1"
            require: cc,ubsan,make,node
          # Intel: the arm64 runners are often short of capacity, and
          # Apple silicon is tested locally before a pull request.
          - name: macos
            os: macos-15-intel
            latest: macos-15-intel
            python: "3.x"
            cc: clang
            require: cc,ubsan,make,node
          # No UBSan runtime: UBSan runs in trap mode. No make.
          - name: windows-mingw
            os: windows-2025
            latest: windows-latest
            python: "3.x"
            cc: gcc
            require: cc,ubsan,node
    env:
      CC: ${{ matrix.cc }}
      APIK_REQUIRE: ${{ matrix.require }}
      APIK_SANITIZE: ${{ matrix.sanitize || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      - run: ${{ matrix.cc }} --version
      - run: python -m pytest -ra

  # The same examples built with emcc and run under node must print what
  # their native builds print.
  wasm:
    runs-on: ${{ inputs.latest && 'ubuntu-latest' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      APIK_REQUIRE: cc,make,node,emcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ inputs.latest && 'latest' || '6.0.13' }}
          actions-cache-folder: emsdk-cache
      - run: python -m pip install -e ".[test]"
      - run: emcc --version
      - run: python -m pytest -ra tests/test_wasm.py

  # Exploratory, not a required check yet: the suite with Microsoft's cl.
  # There is no UBSan for cl, and no make on the runner, so those tests skip.
  windows-msvc:
    runs-on: ${{ inputs.latest && 'windows-latest' || 'windows-2025' }}
    timeout-minutes: 30
    continue-on-error: true
    env:
      CC: cl
      APIK_REQUIRE: cc,node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: pyproject.toml
      # cl needs the environment vcvars64.bat sets up (PATH, INCLUDE, LIB);
      # pass it on to the later steps.
      - name: Load the MSVC environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^(PATH|INCLUDE|LIB|LIBPATH)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
      - run: python -m pip install -e ".[test]"
      # cl prints its version when run with no arguments.
      - name: cl version
        shell: pwsh
        run: |
          & cl 2>&1 | Select-Object -First 1
          exit 0
      - run: python -m pytest -ra
