# The whole test suite on every pull request and every push to main, on
# Linux (gcc and clang), macOS, Windows (MinGW-w64 gcc) and WebAssembly
# (Emscripten and node). Each job names in SCRIBE_REQUIRE the tools it
# installs, so a test that needs one fails instead of skipping.
#
# The weekly workflow calls it with `latest: true` (the newest runner images
# and Emscripten) and with more, reseeded, random cases.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      latest:
        type: boolean
        default: false
      random-scale:
        type: string
        default: ""
      random-seed:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"
  # Empty except when called: the random tests keep their fixed cases.
  SCRIBE_RANDOM_SCALE: ${{ inputs.random-scale }}
  SCRIBE_RANDOM_SEED: ${{ inputs.random-seed }}

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ inputs.latest && matrix.latest || matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Python Scribe supports.
          - name: linux-gcc
            os: ubuntu-24.04
            latest: ubuntu-latest
            python: "3.10"
            cc: gcc
            require: cc,ubsan,make,node
          # Every end-to-end program also built with UBSan.
          - name: linux-clang-ubsan
            os: ubuntu-24.04
            latest: ubuntu-latest
            python: "3.x"
            cc: clang
            sanitize: "1"
            require: cc,ubsan,make,node
          # Intel: the arm64 runners are often short of capacity, and
          # Apple silicon is tested locally before a pull request.
          - name: macos
            os: macos-15-intel
            latest: macos-15-intel
            python: "3.x"
            cc: clang
            require: cc,ubsan,make,node
          # No UBSan runtime: UBSan runs in trap mode. No make.
          - name: windows-mingw
            os: windows-2025
            latest: windows-latest
            python: "3.x"
            cc: gcc
            require: cc,ubsan,node
    env:
      CC: ${{ matrix.cc }}
      SCRIBE_REQUIRE: ${{ matrix.require }}
      SCRIBE_SANITIZE: ${{ matrix.sanitize || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      - run: ${{ matrix.cc }} --version
      - run: python -m pytest -ra

  # The same examples built with emcc and run under node must print what
  # their native builds print.
  wasm:
    runs-on: ${{ inputs.latest && 'ubuntu-latest' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      SCRIBE_REQUIRE: cc,make,node,emcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ inputs.latest && 'latest' || '6.0.13' }}
          actions-cache-folder: emsdk-cache
      - run: python -m pip install -e ".[test]"
      - run: emcc --version
      - run: python -m pytest -ra tests/test_wasm.py
