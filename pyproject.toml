[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scribe-lang"
dynamic = ["version"]
description = "Scribe language compiler implemented with Python and Lark"
requires-python = ">=3.10"
dependencies = ["lark>=1.1,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=6", "tomli>=2; python_version < '3.11'"]

[project.scripts]
scribe = "scribe_lang.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["scribe_lang*"]

[tool.setuptools.dynamic]
version = {file = "VERSION.txt"}

[tool.setuptools.package-data]
scribe_lang = ["grammar/*.lark", "web/*.html", "web/*.js", "web/*.css", "web/*.json", "web/vendor/*"]

# Coverage of the compiler, lines and branches. The coverage workflow fails
# below fail_under: raise it as the tests improve, never lower it.
[tool.coverage.run]
source = ["scribe_lang"]
branch = true

[tool.coverage.report]
fail_under = 97
show_missing = true
skip_covered = true
